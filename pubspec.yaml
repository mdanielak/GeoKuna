name: geokuna
description: "GeoKuna — offline nauka geografii przez mapę i quizy."
publish_to: 'none'

version: 0.4.0+4

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  diacritic: ^0.1.6
  fsrs: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.1

flutter:

  uses-material-design: true
  assets:
    - assets/content/
    - assets/maps/
    - assets/mascot/
